# Agentic DevOps Extravaganza
#
#   docker compose up site              the showcase page on :8080
#   docker compose up demo              site + mock K8s API + LLM proxy
#   docker compose run --rm scan        k8sgpt analyze, no LLM
#   docker compose run --rm remediate   real kubectl fixes: 8 findings -> 0
#   docker compose run --rm explain     k8sgpt --explain (needs an LLM backend)
#   docker compose run --rm triage      the alert triage agent
#   docker compose run --rm uat         the acceptance suite
#
# LLM backend selection is by environment, never by a baked-in vendor:
#   LLM_BACKEND=ollama  (default)  LLM_BASE_URL=http://host.docker.internal:11434/v1
#   LLM_BACKEND=openai            OPENAI_API_KEY=...
#   LLM_BACKEND=replay            no network; replays captured/llm_cache.json

x-common: &common
  build: .
  image: agentic-devops-extravaganza:latest
  environment:
    LLM_BACKEND: ${LLM_BACKEND:-replay}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_MODEL: ${LLM_MODEL:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ZAI_API_KEY: ${ZAI_API_KEY:-}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  restart: "no"

services:
  site:
    <<: *common
    container_name: agentic-devops-site
    ports: ["8080:80"]
    command: ["site"]
    restart: unless-stopped

  demo:
    <<: *common
    container_name: agentic-devops-demo
    ports: ["8080:80", "8443:8443", "8081:8081"]
    command: ["demo"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsSk", "https://127.0.0.1:8443/_demo/health"]
      interval: 10s
      timeout: 3s
      retries: 6

  scan:      {<<: *common, command: ["scan"]}
  explain:   {<<: *common, command: ["explain"]}
  remediate: {<<: *common, command: ["remediate"]}
  triage:    {<<: *common, command: ["triage"]}
  uat:       {<<: *common, command: ["uat"]}
